<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>โปรแกรมคำนวณเงินกู้</title>
    <meta name="description" content="โปรแกรมคำนวณค่างวดรายเดือน ดอกเบี้ย และยอดชำระรวมของเงินกู้">
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="calculator-container">
        <div class="calculator-header">
            <div class="icon-container">
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    class="header-icon">
                    <rect width="16" height="20" x="4" y="2" rx="2" ry="2" />
                    <line x1="8" x2="16" y1="6" y2="6" />
                    <line x1="16" x2="16.01" y1="10" y2="10" />
                    <line x1="12" x2="12.01" y1="10" y2="10" />
                    <line x1="8" x2="8.01" y1="10" y2="10" />
                    <line x1="16" x2="16.01" y1="14" y2="14" />
                    <line x1="12" x2="12.01" y1="14" y2="14" />
                    <line x1="8" x2="8.01" y1="14" y2="14" />
                    <line x1="16" x2="16.01" y1="18" y2="18" />
                    <line x1="12" x2="12.01" y1="18" y2="18" />
                    <line x1="8" x2="8.01" y1="18" y2="18" />
                </svg>
            </div>
            <h1>คำนวณเงินกู้</h1>
            <p>วางแผนการเงินของคุณได้อย่างง่ายดาย แม่นยำ และรวดเร็ว</p>
        </div>

        <div class="calculator-body">
            <div class="input-section">
                <div class="input-group">
                    <label for="amount">วงเงินกู้ (บาท)</label>
                    <div class="input-wrapper">
                        <span class="currency-symbol">฿</span>
                        <input type="number" id="amount" placeholder="เช่น 1,000,000" min="0">
                    </div>
                </div>

                <div class="input-group">
                    <label for="interestRate">อัตราดอกเบี้ยต่อปี (%)</label>
                    <div class="input-wrapper">
                        <span class="percent-symbol">%</span>
                        <input type="number" id="interestRate" placeholder="เช่น 5.5" min="0" step="0.1">
                    </div>
                </div>

                <div class="input-group">
                    <label for="term">ระยะเวลากู้</label>
                    <div class="term-inputs">
                        <div class="input-wrapper">
                            <input type="number" id="termYears" placeholder="จำนวนปี" min="0">
                            <span class="unit">ปี</span>
                        </div>
                        <div class="input-wrapper">
                            <input type="number" id="termMonths" placeholder="จำนวนเดือน" min="0" max="11">
                            <span class="unit">เดือน</span>
                        </div>
                    </div>
                </div>

                <button id="calculateBtn" class="btn-primary">
                    <span>คำนวณค่างวดทันที</span>
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M5 12h14" />
                        <path d="m12 5 7 7-7 7" />
                    </svg>
                </button>
            </div>

            <div class="result-section">
                <h2>สรุปผลการคำนวณ</h2>

                <div class="result-card primary-result">
                    <span class="result-label">ผ่อนชำระต่อเดือนประมาณ</span>
                    <span class="result-value" id="monthlyPayment">฿0.00</span>
                </div>

                <div class="result-breakdown">
                    <div class="result-item">
                        <span class="label">ยอดเงินกู้รวม</span>
                        <span class="value" id="totalPrincipal">฿0.00</span>
                    </div>
                    <div class="result-item">
                        <span class="label">ดอกเบี้ยชำระรวม</span>
                        <span class="value" id="totalInterest">฿0.00</span>
                    </div>
                    <div class="result-item highlight">
                        <span class="label">ยอดชำระสุทธิ (ต้น+ดอก)</span>
                        <span class="value" id="totalPayment">฿0.00</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
